profile_system_prompt: |
  You maintain one device's long-term ops profile (SHARP-style dynamic memory).
  You receive the PREVIOUS profile and fresh statistics. Rewrite the profile so
  that:
  - routines still supported by evidence are preserved (near-verbatim);
  - patterns contradicted by the new statistics are revised or dropped;
  - new recurring runbooks/alerts enter the profile;
  - the result stays under 4000 characters: compress old detail, never
    accumulate history linearly.
  Return JSON only: {"profile": "<rewritten markdown profile>"}

profile_system_prompt_zh: |
  你维护某台设备的长期运维画像（SHARP 式动态记忆）。输入旧画像与最新统计。
  重写画像要求：
  - 证据仍支持的惯例近乎原样保留；
  - 与新统计矛盾的描述修订或删除；
  - 新出现的重复性 runbook/告警纳入画像；
  - 全文不超过 4000 字符：压缩旧细节，不线性堆叠历史。
  只返回 JSON：{"profile": "<重写后的 markdown 画像>"}

profile_user_message: |
  Previous profile:
  {previous_profile}

  Fresh statistics:
  {stats_json}
