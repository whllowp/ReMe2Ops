# Ops edge instance: short-term memory (fast local retrieval) + distillation push.
#
# Start next to a cloud instance (see ops_cloud.yaml):
#   reme start config=ops_edge service.port=2333 workspace_dir=/path/to/edge-workspace
#
# Cloud coordinates default to 127.0.0.1:2444 and can be overridden with the
# OPS_CLOUD_HOST / OPS_CLOUD_PORT environment variables.
extends: default

jobs:
  # Long-term sedimentation lives on the cloud; the edge never dreams locally.
  dream_cron:
    enabled: false
  auto_dream:
    enabled: false

  ops_search:
    backend: base
    description: >-
      Tiered ops memory search: local muscle reflex (digest/muscle mirror),
      short-term daily working memory, then cloud long-term digest via
      node_search; merged, tier-weighted, and boosted by solved/failed usage.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "search query"
        limit:
          type: integer
          description: "max merged results"
          default: 5
      required:
        - query
    steps:
      - backend: ops_search_step
        tier_limit: 5
        muscle_weight: 1.0
        daily_weight: 0.6
        cloud_weight: 0.4
        # Boost precedence (promote.py contract): explicit kwargs > deployed
        # ranking snapshot > built-in defaults. The bootstrap values
        # (usage_boost 0.05 / confirmed_boost 0.05 / conflict_penalty 0.15)
        # moved into tiered_search.py so the round-10 dreaming calibration
        # (metadata/ops_policy/ranking.json, deployed via muscle_list ->
        # muscle_sync) takes effect automatically once it reaches the edge —
        # explicit keys here would always override the deployed snapshot and
        # make calibration dead code. Only set them explicitly to pin values.
        # JARVIS-1 preflight (display only, never weighted): hits whose SOP
        # carries ## Failure Notes get a warning line + preflight field.
        preflight_warnings: true
        # MATM state-conditioned key: infer_last_category infers last_category
        # from the session's local usage history when the caller did not pass
        # one; transition_boost > 0 is the second half of the wiring — it
        # activates the structural-support term the inferred key feeds. Both
        # keys are required for the pathway to be live.
        infer_last_category: true
        transition_boost: 0.1
        # MATM §4.3 retrieval planner (deterministic heuristic, no LLM):
        # cloud_gate_min_solved > 0 switches to two-phase search — local tiers
        # first, cloud consulted only if the muscle top hit lacks decisive
        # reflex evidence: usage solved >= cloud_gate_min_solved with
        # success_rate >= cloud_gate_min_rate, or in-tier dominance
        # top1/(top1+top2) >= cloud_gate_dominance. All criteria dimensionless
        # (counts/ratios — retrieval scores are non-normalized and vary by
        # query/branch mode). Latency honesty: a gate that stays closed turns
        # max(local, cloud) into local + cloud; the saving exists only in the
        # triggered direction. 0 keeps today's concurrent three-tier gather.
        # To enable: cloud_gate_min_solved: 3  (optionally cloud_gate_min_rate:
        # 0.8 / cloud_gate_dominance: 0.7, the defaults).
        cloud_gate_min_solved: 0
        cloud_host: ${OPS_CLOUD_HOST:-127.0.0.1}
        cloud_port: ${OPS_CLOUD_PORT:-2444}
        cloud_timeout: 8.0

  ops_feedback:
    backend: base
    description: >-
      Record whether an ops_search hit solved the incident; usage deltas are
      synced to the cloud by ops_muscle_sync and drive SOP promotion.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: "workspace-relative digest path that was used"
        outcome:
          type: string
          enum: [solved, failed]
          description: "did the memory solve the problem"
        query:
          type: string
          description: "optional originating query"
          default: ""
        session_id:
          type: string
          description: "optional incident/session id"
          default: ""
      required:
        - path
        - outcome
    steps:
      - backend: ops_feedback_step

  ops_dream_push:
    backend: base
    # Job-level hint (salience guidance) reaches dream extract/integrate via
    # the RuntimeContext both call paths build from job kwargs; an explicit
    # caller-supplied hint still wins over it.
    hint: >-
      salience: record only rules, policies, and lessons the environment cannot
      reveal at run time (ordering constraints, permissions, failure causes);
      failure lessons take priority over success stories; skip everything the
      environment would re-reveal on the next run anyway.
    description: >-
      Extract memory units from recent daily notes and push them to the cloud
      for long-term integration; failed pushes stay deferred for the next run.
    parameters:
      type: object
      properties:
        date:
          type: string
          description: "YYYY-MM-DD anchor; defaults to today in the edge timezone"
          default: ""
        scan_days:
          type: integer
          description: "number of recent daily directories to scan, ending at date"
          default: 2
        max_units:
          type: integer
          description: "maximum number of extracted memory units"
          default: 5
        max_chars_per_batch:
          type: integer
          description: "estimated bytes of changed file content per extraction call"
          default: 40000
        hint:
          type: string
          description: "caller guidance passed through to dream extract/integrate"
          default: ""
        source_device:
          type: string
          description: "edge device label recorded in cloud metadata"
          default: "edge"
    steps: &ops_push_steps
      - backend: dream_extract_step
        file_catalog: dream
        scan_days: 2
        max_units: 5
        max_chars_per_batch: 40000
      # Defense gate 1 (edge outbound): scrub PII/secret hits from unit
      # name/summary before anything leaves the device; hit values become
      # [REDACTED:<pattern>] placeholders and units continue downstream.
      # mode: block would discard hitting units once instead (see ops_cloud).
      - backend: ops_defense_scan_step
        mode: redact
      - backend: ops_push_step
        source_device: edge
        cloud_host: ${OPS_CLOUD_HOST:-127.0.0.1}
        cloud_port: ${OPS_CLOUD_PORT:-2444}
        cloud_timeout: 30.0
      - backend: dream_finish_step
        file_catalog: dream

  ops_dream_push_cron:
    backend: cron
    cron: "30 22 * * *"
    hint: >-
      salience: record only rules, policies, and lessons the environment cannot
      reveal at run time (ordering constraints, permissions, failure causes);
      failure lessons take priority over success stories; skip everything the
      environment would re-reveal on the next run anyway.
    steps: *ops_push_steps

  ops_dream_audit:
    backend: base
    enable_serve: true
    description: >-
      Dreaming correction: re-check muscle mirrors against session transcripts
      and usage records, stamp confirmed/unconfirmed/conflict into the status
      ledger (metadata/ops_audit/status.json), and write correction notes into
      daily/ for the next dream push. Pure report without an LLM.
    parameters:
      type: object
      properties:
        date:
          type: string
          description: "YYYY-MM-DD anchor for correction notes; defaults to today"
          default: ""
    steps: &ops_audit_steps
      - backend: ops_dream_audit_step
        muscle_dir: digest/muscle
        max_audit_per_run: 6
        audit_timeout: 90.0
        evidence_chars: 4000

  ops_dream_audit_cron:
    backend: cron
    cron: "30 21 * * *"
    steps: *ops_audit_steps

  ops_reflex_index:
    backend: base
    enable_serve: true
    description: >-
      Rebuild the bounded MEMORY.md-style reflex index
      (metadata/ops_index/MEMORY.md, 200 lines / 25KB cap) from the muscle
      mirror and the audit status ledger; the session harness injects its head.
    parameters:
      type: object
      properties: {}
    steps:
      - backend: ops_reflex_index_step
        muscle_dir: digest/muscle
        daily_limit: 5

  ops_muscle_sync:
    backend: base
    description: >-
      Push usage deltas to the cloud and mirror muscle SOPs into the local
      digest/muscle directory; the index watcher picks up changes instantly and
      the bounded reflex index is rebuilt afterwards.
    parameters:
      type: object
      properties: {}
    steps: &ops_muscle_sync_steps
      - backend: ops_muscle_sync_step
        cloud_host: ${OPS_CLOUD_HOST:-127.0.0.1}
        cloud_port: ${OPS_CLOUD_PORT:-2444}
        cloud_timeout: 15.0
        device_id: ${OPS_DEVICE_ID:-}
      - backend: ops_reflex_index_step
        muscle_dir: digest/muscle
        daily_limit: 5

  ops_muscle_sync_cron:
    backend: cron
    cron: "0 6 * * *"
    steps: *ops_muscle_sync_steps

  # Live connector session: muscle promotions reach the edge in seconds.
  # Drop this job (or lose 'websockets') and the sync cron remains the
  # fallback path. Reconnects use the background supervisor's backoff.
  ops_connector:
    backend: ops_connector
    cloud_host: ${OPS_CLOUD_HOST:-127.0.0.1}
    cloud_port: ${OPS_CLOUD_PORT:-2444}
    ping_interval: 30.0
    connect_timeout: 10.0
