# Ops cloud instance: long-term knowledge sedimentation + muscle SOP promotion.
#
# Start next to an edge instance (see ops_edge.yaml):
#   reme start config=ops_cloud service.port=2444 workspace_dir=/path/to/cloud-workspace
#
# Decision-model fast track (muscle promotion judged by any OpenAI-compatible
# decision model such as Laya): set DECISION_MODEL_API_KEY, plus
# DECISION_MODEL_BASE_URL / DECISION_MODEL_NAME when not using the default
# agentscope classifier. Without a key the judge skips gracefully and the
# usage-based promotion loop remains the only path to muscle memory.
extends: default

# The connector service keeps every HTTP/MCP endpoint of the default http
# service and adds WS /ops/connector + GET /ops/devices, so clients can
# attach at any time and receive muscle.updated pushes in real time.
service:
  backend: ops_http

jobs:
  # Edge devices push units via cloud_ingest; a local dream would double-process.
  dream_cron:
    enabled: false
  # The cloud has no daily working memory; proactive agenda stays an edge job.
  proactive_refresh_cron:
    enabled: false

  cloud_ingest:
    backend: base
    description: >-
      Ingest memory units pushed from an edge device and integrate them into
      the long-term digest (procedure/personal/wiki) with source provenance.
    parameters:
      type: object
      properties:
        units:
          type: array
          description: "memory units: {name, bucket, summary, paths}"
          items:
            type: object
        source_device:
          type: string
          description: "edge device label"
          default: ""
        date:
          type: string
          description: "YYYY-MM-DD the units were extracted on"
          default: ""
      required:
        - units
    steps:
      - backend: ops_ingest_seed_step
      - backend: dream_integrate_step
      - backend: auto_tag_step

  muscle_list:
    backend: base
    description: "List muscle-bucket SOP files (path, mtime, content) for edge mirrors."
    parameters:
      type: object
      properties: {}
    steps:
      - backend: ops_muscle_list_step

  ops_usage_ingest:
    backend: base
    description: >-
      Append edge usage records (solved/failed per digest path) to the cloud
      aggregate, then let the decision model fast-track confident SOPs into
      muscle memory immediately.
    parameters:
      type: object
      properties:
        records:
          type: array
          description: "usage records: {ts, path, outcome, query?, session_id?}"
          items:
            type: object
      required:
        - records
    steps:
      - backend: ops_usage_ingest_step
      - backend: ops_muscle_judge_step
        as_decision_model: muscle
        auto_promote: true
        muscle_worthy_threshold: 0.8
        evidence_threshold: 0.6
        min_solved: 1
        judge_timeout: 30.0

  ops_muscle_judge:
    backend: base
    description: >-
      Judge given digest SOPs with the decision model (muscle-worthy +
      evidence-sufficient probabilities); confident verdicts are promoted at
      once when auto_promote is on.
    parameters:
      type: object
      properties:
        paths:
          type: array
          description: "workspace-relative digest SOP paths to judge"
          items:
            type: string
        auto_promote:
          type: boolean
          description: "promote promotable verdicts immediately"
          default: true
    steps:
      - backend: ops_muscle_judge_step
        as_decision_model: muscle
        auto_promote: true
        muscle_worthy_threshold: 0.8
        evidence_threshold: 0.6
        min_solved: 1
        judge_timeout: 30.0

  ops_muscle_promote:
    backend: base
    description: >-
      Promote one digest SOP into the muscle bucket (move + frontmatter stamp;
      inbound wikilinks are retargeted automatically) and generate a compact
      reflex card on top.
    parameters:
      type: object
      properties:
        path:
          type: string
          description: "workspace-relative digest SOP path"
      required:
        - path
    steps:
      - backend: ops_muscle_promote_step
      - backend: ops_reflex_card_step
        reflex_card: true
        card_timeout: 60.0

  ops_promotion_cron:
    backend: cron
    cron: "0 4 * * *"
    steps:
      - backend: ops_promotion_scan_step
        # min_solved/min_success_rate/score_threshold default to the deployed
        # replay policy (metadata/ops_policy/policy.json) when not set here.
        max_promotions_per_run: 3
        as_decision_model: muscle
        decision_fast_track: true
        fast_track_min_solved: 1
        max_fast_tracks_per_run: 2
        muscle_worthy_threshold: 0.8
        evidence_threshold: 0.6
        lambda_rate: 0.4
        lambda_solved: 0.3
        lambda_breadth: 0.3
        solved_cap: 20
        score_threshold: 0.45

  # Policy-level RSI loop (Dream-RSI): replay usage worlds, deploy the best
  # promotion policy; the scan picks it up as runtime defaults.
  ops_policy_evolve:
    backend: base
    enable_serve: true
    description: >-
      Replay recorded usage worlds under candidate promotion policies
      (deployed + deterministic grid) and deploy the best-scoring one.
    parameters:
      type: object
      properties:
        policies:
          type: array
          description: "explicit candidate policies; omit for the grid"
          items:
            type: object
    steps: &ops_policy_steps
      - backend: ops_replay_step
      - backend: ops_policy_evolve_step

  ops_policy_evolve_cron:
    backend: cron
    cron: "30 3 * * *"
    steps: *ops_policy_steps

  # Lifecycle decay (memery): cold muscle SOPs are demoted back to the
  # procedure bucket with tombstone stamps - reversible, never deleted.
  ops_decay_scan:
    backend: base
    enable_serve: true
    description: >-
      Heat sweep over the muscle bucket (recency half-life + success rate +
      access); SOPs below the cold bar move back to procedure with a
      tombstone stamp and a negative muscle.updated broadcast.
    parameters:
      type: object
      properties: {}
    steps:
      - backend: ops_decay_scan_step
        cold_threshold: 0.25
        half_life_days: 14.0
        hit_cap: 10.0
        max_demotions_per_run: 3

  # SHARP device profile: dynamic memory bank with bounded updates.
  ops_profile:
    backend: base
    enable_serve: true
    description: >-
      One SHARP update round for a device profile (long-term P + context C +
      statistics S); input stays flat because each round only sees new events
      plus the compressed previous profile.
    parameters:
      type: object
      properties:
        device_id:
          type: string
          description: "device to update; defaults to all-devices aggregate"
          default: ""
    steps:
      - backend: ops_profile_step
        update_timeout: 90.0

  # Time-aware transition graphs (SHARP): global + time-conditioned views.
  ops_transitions:
    backend: base
    enable_serve: true
    description: "Rebuild SOP transition graphs (global/week-type/hour-bin/joint views)."
    parameters:
      type: object
      properties: {}
    steps:
      - backend: ops_transitions_step

  ops_maintenance_cron:
    backend: cron
    cron: "0 5 * * *"
    steps:
      - backend: ops_decay_scan_step
        cold_threshold: 0.25
        half_life_days: 14.0
      - backend: ops_profile_step
      - backend: ops_transitions_step

  # Generalize operator (Harmony Harness): audit muscle scope placement.
  ops_generalize:
    backend: base
    enable_serve: true
    description: >-
      Audit muscle SOPs with an LLM and move them between general and
      device scopes (promote/demote); changes filing, never capability.
    parameters:
      type: object
      properties: {}
    steps:
      - backend: ops_generalize_step
        audit_timeout: 90.0

components:
  as_decision_model:
    muscle:
      backend: ${DECISION_MODEL_BACKEND:-openai_chat}
      model: ${DECISION_MODEL_NAME:-null}
      credential:
        api_key: ${DECISION_MODEL_API_KEY:-}
        base_url: ${DECISION_MODEL_BASE_URL:-null}
      timeout: 15
      max_retries: 1
      retry_delay: 0.5
